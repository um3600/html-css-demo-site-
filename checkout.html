<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | EcomShop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="container">
            <h1 class="logo"><a href="index.html">Ecom<span>Shop</span></a></h1>
            <button class="nav-toggle">&#9776;</button>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="product.html">Products</a>
                <a href="blog.html">Blog</a>
                <a href="contact.html">Contact</a>
                <a href="My-Cart.html">My Cart</a>
                <a href="admin-login.html">Admin</a>
            </nav>
        </div>
    </header>

    <div class="checkout-container">
        <h2>Checkout</h2>
        <p id="totalDisplay" style="text-align:center;font-size:20px;font-weight:700;color:var(--accent-hover);margin-bottom:20px"></p>
        <form id="checkoutForm">
            <input type="text" id="name" placeholder="Full Name" required>
            <input type="email" id="email" placeholder="Email Address" required>
            <input type="text" id="phone" placeholder="JazzCash Mobile Number (03XXXXXXXXX)" pattern="03[0-9]{9}" required>
            <button type="submit" id="payBtn">Pay with JazzCash</button>
        </form>
    </div>

    <!-- JazzCash Payment Modal -->
    <div class="modal-overlay" id="jazzcashModal">
        <div class="modal-box">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <h2>Confirm Payment</h2>
            <span class="jazzcash-badge">JAZZCASH</span>
            <div class="modal-total">Amount: <span id="modalAmount">Rs. 0</span></div>
            <input type="text" id="jcName" placeholder="Account Holder Name" readonly>
            <input type="text" id="jcPhone" placeholder="JazzCash Number" readonly>
            <input type="text" id="jcPin" placeholder="Enter 5-digit PIN" maxlength="5" pattern="[0-9]{5}" required>
            <button class="pay-btn" id="confirmPayBtn" onclick="confirmPayment()">Confirm & Pay</button>
            <p style="text-align:center;font-size:12px;color:#999;margin-top:12px">This is a demo payment. No real money is charged.</p>
        </div>
    </div>

    <script>
        document.querySelector('.nav-toggle').addEventListener('click', () => {
            document.querySelector('.nav-links').classList.toggle('show');
        });

        if (localStorage.getItem("userLogged") !== "true") {
            alert("You must login first!");
            window.location.href = "login.html";
        }

        const total = localStorage.getItem("checkoutTotal") || 0;
        const userName = localStorage.getItem("userName") || "";
        const userEmail = localStorage.getItem("userEmail") || "";

        document.getElementById("totalDisplay").innerText = "Total: Rs. " + Number(total).toLocaleString("en-PK");
        if (userName) document.getElementById("name").value = userName;
        if (userEmail) document.getElementById("email").value = userEmail;

        function formatPKR(n) { return "Rs. " + Number(n).toLocaleString("en-PK"); }

        document.getElementById("checkoutForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const phone = document.getElementById("phone").value.trim();

            if (!name || !email || !phone) { alert("Please fill all fields"); return; }
            if (!phone.match(/^03[0-9]{9}$/)) { alert("Enter valid JazzCash number (03XXXXXXXXX)"); return; }

            document.getElementById("jcName").value = name;
            document.getElementById("jcPhone").value = phone;
            document.getElementById("modalAmount").innerText = formatPKR(total);
            document.getElementById("jazzcashModal").classList.add("active");
        });

        function closeModal() {
            document.getElementById("jazzcashModal").classList.remove("active");
        }

        function confirmPayment() {
            const pin = document.getElementById("jcPin").value.trim();
            if (!pin || pin.length !== 5 || !/^\d+$/.test(pin)) {
                alert("Enter valid 5-digit PIN");
                return;
            }

            const phone = document.getElementById("jcPhone").value;
            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;

            const orderData = {
                orderId: "ECOM-" + Math.floor(100000 + Math.random() * 900000),
                name: name,
                email: email,
                account: phone,
                amount: total,
                method: "JazzCash",
                status: "Paid",
                date: new Date().toLocaleDateString("en-PK")
            };

            localStorage.setItem("order", JSON.stringify(orderData));
            let orders = JSON.parse(localStorage.getItem("orders")) || [];
            orders.push(orderData);
            localStorage.setItem("orders", JSON.stringify(orders));
            localStorage.removeItem("cart");
            localStorage.removeItem("checkoutTotal");

            closeModal();
            window.location.href = "success.html";
        }
    </script>
</body>
</html>
