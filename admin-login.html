<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | EcomShop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="container">
            <h1 class="logo"><a href="index.html">Ecom<span>Shop</span></a></h1>
            <button class="nav-toggle">&#9776;</button>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="product.html">Products</a>
                <a href="blog.html">Blog</a>
                <a href="contact.html">Contact</a>
                <a href="My-Cart.html">My Cart</a>
                <a href="admin-login.html" class="active">Admin</a>
            </nav>
        </div>
    </header>

    <section class="login-wrapper">
        <div class="login-box">
            <h2>Admin Login</h2>
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button onclick="login()">Login</button>
        </div>
    </section>

    <script>
        document.querySelector('.nav-toggle').addEventListener('click', () => {
            document.querySelector('.nav-links').classList.toggle('show');
        });

        function login() {
            const user = document.getElementById("username").value.trim();
            const pass = document.getElementById("password").value.trim();

            if (!user || !pass) {
                alert("Please fill in all fields");
                return;
            }

            if (user === "admin" && pass === "E-HUB") {
                localStorage.setItem("adminLogged", "true");
                window.location.href = "admin.html";
            } else {
                alert("Invalid credentials. Use admin / E-HUB");
            }
        }
    </script>
</body>
</html>
